pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://repo.spring.io/release" }
    }
    plugins {
        id "org.springframework.boot" version "3.3.2"
        id "io.spring.dependency-management" version "1.1.5"
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "vroomvroom-msa"
include(
        "common-lib",
        "user-service",
        "hub-service",
        "order-service",
        "gateway-service",
        "eureka-server",
        "slack-service"
)
